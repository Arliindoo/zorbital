<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Dashboard of NASA investigations on microgravity combustion" />
    <script>
      // tema salvo, aplicado antes da primeira pintura para a página não piscar na cor errada
      try {
        if (JSON.parse(localStorage.getItem('zorbital:theme')) === 'light') {
          document.documentElement.dataset.theme = 'light'
          document.querySelector('meta[name="theme-color"]').content = '#f1f0ea'
        }
      } catch {}
    </script>
    <title>Zorbital — microgravity combustion</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
