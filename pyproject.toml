[project]
name = "spaceapps"
version = "0.1.0"
description = "Dashboard interativo de análise e comparação de dados, com interpretação por IA"
readme = "README.md"
authors = [
    { name = "MendanhaPuh", email = "ernesto_tteeu@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "openai>=3.51.0",
    "openpyxl>=3.1.5",
    "plotly>=7.1.0",
    "polars>=2.1.0",
    "python-dotenv>=1.2.4",
    "streamlit>=1.67.0",
]

[project.scripts]
spaceapps-build = "spaceapps.ingest.build:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.pycodestyle]
max-line-length = 120  # o formatador quebra código em 110; a folga é para frases de prompt e descrições

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # linhas de fixture copiadas do formato das fontes

[tool.pytest.ini_options]
testpaths = ["tests"]
